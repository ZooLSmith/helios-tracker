<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Helios Tracker</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/drawer.css">
</head>
<body>
<canvas id="map"></canvas>
<div id="msg"></div>
<div id="panel">
  <div class="head">
    <div class="title" aria-label="Helios Tracker"><img class="logo" src="img/logo.png" alt="H">ELIOS TRACKER</div>
    <button id="collapse" data-icon="chevronDown" data-i18n-title="panel.collapse"></button>
  </div>
  <div class="body">
    <div id="level">—</div>
    <div id="levelLv" class="levellv"></div>
    <div class="ptabs" id="ptabs">
      <button data-ptab="info" data-i18n="ptab.info"></button><button data-ptab="layers" data-i18n="ptab.layers"></button><button data-ptab="settings" data-i18n="ptab.settings"></button>
    </div>
    <section class="ptab" data-ptab="info">
      <h3 data-i18n="h.mission"></h3>
      <div id="mission"><div class="muted" data-i18n="mission.none"></div></div>
      <h3 data-i18n="h.players"></h3>
      <div id="players" class="players"><div class="muted">—</div></div>
    </section>
    <section class="ptab" data-ptab="layers">
    <div class="btnrow">
      <button class="act" id="layersAll" data-i18n="layers.all"></button><button class="act" id="layersNone" data-i18n="layers.none"></button><button class="act" id="layersClose" data-i18n="layers.closeAll" data-i18n-title="layers.closeAllTip"></button>
    </div>
    <div id="layers"></div>
    </section>
    <section class="ptab" data-ptab="settings">
    <h3 data-i18n="h.who"></h3>
    <select id="target"></select>
    <div class="checkrow">
      <label class="row"><input type="checkbox" id="follow"> <span data-i18n="view.follow"></span> <span class="count">F</span></label>
      <label class="row"><input type="checkbox" id="rotate"> <span data-i18n="view.rotate"></span> <span class="count">R</span></label>
    </div>
    <h3 data-i18n="view.motion" data-i18n-title="view.motionTip"></h3>
    <select id="motion" data-i18n-title="view.motionTip"></select>
    <button class="act" id="fit"><span data-i18n="view.fit"></span> <span style="color:var(--dim)">(0)</span></button>
    <h3 data-i18n="view.language"></h3>
    <select id="lang"></select>
    <div class="hint" data-i18n="view.hint"></div>
    </section>
  </div>
</div>
<div id="inspector">
  <div class="ihead">
    <div class="row1"><div class="who" id="iwho"></div><button class="iclose" id="iclose" data-icon="close" data-i18n-title="insp.close"></button></div>
    <div class="sub" id="isub"></div>
    <div class="tabs" id="itabs">
      <button data-tab="info" data-i18n="tab.info"></button><button data-tab="gear" data-i18n="tab.gear"></button><button data-tab="backpack" data-i18n="tab.backpack"></button><button data-tab="skills" data-i18n="tab.skills"></button>
    </div>
  </div>
  <div class="ibody" id="ibody"></div>
</div>
<div id="tip"></div>
<div id="coords"></div>
<div id="status"><i></i><span></span></div>
<script type="module">
  import { start } from "./js/main.js";
  start();
</script>
</body>
</html>
