<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Helios Tracker</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/drawer.css">
<link rel="stylesheet" href="css/themes.css">
</head>
<body>
<canvas id="map"></canvas>
<div id="msg"></div>
<div id="panel">
  <div class="head">
    <div class="title"><span class="h">H</span><span class="rest">ELIOS TRACKER</span></div>
    <button id="collapse" data-icon="chevronDown" data-i18n-title="panel.collapse"></button>
  </div>
  <div class="body">
    <div id="level">—</div>
    <div id="levelLv" class="levellv"></div>
    <div class="ptabs" id="ptabs">
      <button data-ptab="info" data-i18n="ptab.info"></button><button data-ptab="layers" data-i18n="ptab.layers"></button><button data-ptab="settings" data-i18n="ptab.settings"></button>
    </div>
    <section class="ptab" data-ptab="info"><div class="pscroll">
      <div id="cutscene" hidden></div>
      <div class="isec" data-sec="mission">
        <div class="ishead" data-i18n-title="info.foldTip"><span class="isfold"></span><h3 data-i18n="h.mission"></h3>
          <button class="islink" id="missionAll" data-log="1" data-i18n="info.all" data-i18n-title="mission.all" hidden></button></div>
        <div id="mission" class="isbody"><div class="muted" data-i18n="mission.none"></div></div>
      </div>
      <div class="isec" data-sec="shops">
        <div class="ishead" data-i18n-title="info.foldTip"><span class="isfold"></span><h3 data-i18n="h.shops"></h3>
          <span class="istimer" id="shopsTimer" hidden><span data-icon="timer"></span><span data-shop-clock></span></span>
          <button class="islink" id="shopsAll" data-shops="1" data-i18n="info.all" data-i18n-title="shops.all" hidden></button></div>
        <div id="shops" class="isbody"></div>
      </div>
      <div class="isec" data-sec="players">
        <div class="ishead" data-i18n-title="info.foldTip"><span class="isfold"></span><h3 data-i18n="h.players"></h3>
          <span class="iscount" id="playersCount"></span></div>
        <div id="players" class="players isbody"><div class="muted">—</div></div>
      </div>
    </div></section>
    <section class="ptab" data-ptab="layers">
    <div class="btnrow">
      <button class="act" id="layersAll" data-i18n="layers.all" data-i18n-title="layers.allTip"></button><button class="act" id="layersNone" data-i18n="layers.none" data-i18n-title="layers.noneTip"></button><button class="act" id="layersClose" data-i18n="layers.closeAll" data-i18n-title="layers.closeAllTip"></button>
    </div>
    <div id="layers" class="pscroll"></div>
    </section>
    <section class="ptab" data-ptab="settings"><div class="pscroll">
    <h3 data-i18n="h.who"></h3>
    <select id="target"></select>
    <div class="checkrow">
      <label class="row"><input type="checkbox" id="follow"> <span data-i18n="view.follow"></span> <span class="count">F</span></label>
      <label class="row"><input type="checkbox" id="rotate"> <span data-i18n="view.rotate"></span> <span class="count">R</span></label>
    </div>
    <button class="act" id="fit"><span data-i18n="view.fit"></span> <span style="color:var(--dim)">(0)</span></button>
    <h3 data-i18n="h.map" data-i18n-title="h.mapTip"></h3>
    <div class="cset" data-i18n-title="view.mapColorsTip"><span class="clabel" data-i18n="view.mapColors"></span><select id="mapColors"></select></div>
    <div class="cset"><span class="clabel" data-i18n="view.bgOpacity"></span><input type="range" id="bgOpacity" min="0" max="100" step="5"><span class="cval" id="bgOpacityVal"></span></div>
    <div class="cset"><span class="clabel" data-i18n="view.mapOpacity"></span><input type="range" id="mapOpacity" min="0" max="100" step="5"><span class="cval" id="mapOpacityVal"></span></div>
    <div class="cset" data-i18n-title="view.markerScaleTip"><span class="clabel" data-i18n="view.markerScale"></span><input type="range" id="markerScale" min="50" max="200" step="10"><span class="cval" id="markerScaleVal"></span></div>
    <div class="checkrow">
      <label class="row" data-i18n-title="view.threeDTip"><input type="checkbox" id="threeD"> <span data-i18n="view.threeD"></span> <span class="count">3</span></label>
      <label class="row"><input type="checkbox" id="coords-on"> <span data-i18n="view.coords"></span> <span class="count">C</span></label>
    </div>
    <h3 data-i18n="h.panels" data-i18n-title="h.panelsTip"></h3>
    <div class="cset"><span class="clabel" data-i18n="view.theme"></span><select id="theme"></select></div>
    <div class="cset"><span class="clabel" data-i18n="view.panelOpacity"></span><input type="range" id="panelOpacity" min="20" max="100" step="5"><span class="cval" id="panelOpacityVal"></span></div>
    <div class="cset" data-i18n-title="view.uiScaleTip"><span class="clabel" data-i18n="view.uiScaleLabel"></span><input type="range" id="uiScale" min="70" max="200" step="10"><span class="cval" id="uiScaleVal"></span></div>
    <h3 data-i18n="view.motion" data-i18n-title="view.motionTip"></h3>
    <select id="motion" data-i18n-title="view.motionTip"></select>
    <h3 data-i18n="h.language"></h3>
    <select id="lang"></select>
    <div class="hint" data-i18n="view.hint"></div>
    </div></section>
    <button class="mtotop" id="pToTop" data-icon="chevronUp" data-i18n-title="mlog.toTop"></button>
  </div>
</div>
<div id="inspector">
  <div class="ihead">
    <div class="row1"><div class="who" id="iwho"></div><button class="iclose ifold" id="ifold" hidden></button><button class="iclose" id="iclose" data-icon="close" data-i18n-title="insp.close"></button></div>
    <div class="sub" id="isub"></div>
    <div class="tabs" id="itabs">
      <button data-tab="info" data-i18n="tab.info"></button><button data-tab="gear" data-i18n="tab.gear"></button><button data-tab="backpack" data-i18n="tab.backpack"></button><button data-tab="skills" data-i18n="tab.skills"></button>
    </div>
  </div>
  <div class="ibody" id="ibody"></div>
</div>
<div id="tip"></div>
<div id="coords"></div>
<div id="status"><i></i><span></span></div>
<button id="north" data-icon="compass" data-i18n-title="view.northTip" hidden></button>
<script type="module">
  import { start } from "./js/main.js";
  start();
</script>
</body>
</html>
